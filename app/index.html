<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Splat Convert Desktop</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="renderer.js"></script>
</head>
<body>
  <header><h1>Splat Convert <span data-i18n="app.header.local"></span></h1><div class="header-tools"><span class="engine">Splat Transform 3.12.0</span><label class="language"><img src="icons/languages.svg" alt=""><select id="language" data-i18n-aria="app.header.language"></select></label></div></header>
  <main>
    <fieldset id="workspace">
      <section class="inputs">
        <div class="section-head"><h2><b>01</b> <span data-i18n="app.inputs.title"></span></h2><span id="total"></span></div>
        <div class="toolbar">
          <button id="add-files"><img src="icons/plus.svg" alt=""><span data-i18n="app.inputs.add"></span></button>
          <button id="remove-file" class="icon" data-i18n-title="app.inputs.remove" data-i18n-aria="app.inputs.remove"><img src="icons/minus.svg" alt=""></button>
          <button id="file-up" class="icon" data-i18n-title="app.inputs.up" data-i18n-aria="app.inputs.up"><img src="icons/arrow-up.svg" alt=""></button>
          <button id="file-down" class="icon" data-i18n-title="app.inputs.down" data-i18n-aria="app.inputs.down"><img src="icons/arrow-down.svg" alt=""></button>
        </div>
        <div id="drop-zone"><table><thead><tr><th data-i18n="app.inputs.fileName"></th><th data-i18n="app.inputs.size"></th></tr></thead><tbody id="file-list"></tbody></table></div>
        <div class="section-head"><h2><b>02</b> <span data-i18n="app.pipeline.title"></span></h2></div>
        <div class="toolbar"><select id="scope" data-i18n-aria="app.pipeline.scopeLabel"><option value="-1" data-i18n="app.pipeline.merged"></option></select>
          <button id="add-op" class="icon" data-i18n-title="app.pipeline.addOp" data-i18n-aria="app.pipeline.addOp"><img src="icons/plus.svg" alt=""></button>
          <button id="edit-op" class="icon" data-i18n-title="app.pipeline.editOp" data-i18n-aria="app.pipeline.editOp"><img src="icons/pencil.svg" alt=""></button>
          <button id="remove-op" class="icon" data-i18n-title="app.inputs.remove" data-i18n-aria="app.inputs.remove"><img src="icons/minus.svg" alt=""></button>
          <button id="op-up" class="icon" data-i18n-title="app.inputs.up" data-i18n-aria="app.inputs.up"><img src="icons/arrow-up.svg" alt=""></button>
          <button id="op-down" class="icon" data-i18n-title="app.inputs.down" data-i18n-aria="app.inputs.down"><img src="icons/arrow-down.svg" alt=""></button>
        </div>
        <select id="operations" size="5" data-i18n-aria="app.pipeline.opsListLabel"></select>
      </section>
      <section class="settings">
        <div class="section-head"><h2><b>03</b> <span data-i18n="app.settings.title"></span></h2></div>
        <label class="field"><span data-i18n="app.settings.format"></span><select id="format"></select></label>
        <div class="field"><label for="output" data-i18n="app.settings.output"></label><div class="path-field"><input id="output" type="text" spellcheck="false"><button id="browse-output" class="icon" data-i18n-title="app.settings.browse" data-i18n-aria="app.settings.browse"><img src="icons/folder-open.svg" alt=""></button></div></div>
        <label class="slider"><span data-i18n="app.settings.keep"></span><input id="keep" type="range" min="1" max="100" value="100"><output for="keep">100%</output></label>
        <label class="slider sog-setting"><span data-i18n="app.settings.iterations"></span><input id="iterations" type="range" min="1" max="100" value="10"><output for="iterations">10</output></label>
        <label class="slider sog-setting"><span data-i18n="app.settings.effort"></span><input id="effort" type="range" min="-1" max="9" value="-1"><output for="effort"></output></label>
        <label class="slider sog-setting"><span data-i18n="app.settings.workers"></span><input id="workers" type="range" min="0" max="16" value="4"><output for="workers">4</output></label>
        <label class="slider voxel-setting" hidden><span data-i18n="app.settings.voxel"></span><input id="voxel" type="range" min="1" max="500" value="50"><output for="voxel">0.05</output></label>
        <label class="slider voxel-setting" hidden><span data-i18n="app.settings.opacity"></span><input id="opacity" type="range" min="0" max="100" value="10"><output for="opacity">0.1</output></label>
        <label class="field" id="device-field"><span data-i18n="app.settings.device"></span><select id="device"><option value="auto" data-i18n="app.devices.auto"></option><option value="cpu" data-i18n="app.devices.cpu"></option><option value="metal" data-i18n="app.devices.metal"></option></select></label>
        <button id="licenses" class="quiet" data-i18n="app.settings.licenses"></button>
      </section>
    </fieldset>
    <section class="logs"><h2 data-i18n="app.actions.logs"></h2><pre id="log" aria-live="off"></pre></section>
    <footer><div><strong id="status" role="status"></strong><button id="show-output" class="quiet" data-i18n="app.actions.openOutput" hidden></button></div><div class="toolbar"><button id="cancel" disabled><img src="icons/square.svg" alt=""><span data-i18n="common.cancel"></span></button><button id="start" class="primary" disabled><img src="icons/play.svg" alt=""><span data-i18n="app.actions.start"></span></button></div></footer>
    <progress id="progress" max="100" value="0" data-i18n-aria="app.actions.progressAria"></progress>
    <a id="repository" href="https://github.com/a13409512853-maker/splat-convert-desktop"><img src="icons/github.svg" alt="">https://github.com/a13409512853-maker/splat-convert-desktop</a>
  </main>
  <aside class="resource-bar" data-i18n-aria="app.actions.resourcesAria"><span id="metric-cpu"><img src="icons/cpu.svg" alt=""><span></span></span><span id="metric-memory"><img src="icons/memory-stick.svg" alt=""><span></span></span><span id="metric-gpu"><img src="icons/monitor.svg" alt=""><span></span></span><span id="metric-vram"><img src="icons/microchip.svg" alt=""><span></span></span></aside>
  <dialog id="operation-dialog"><form method="dialog" id="operation-form"><h2 id="op-title"></h2><select id="op-type" data-i18n-aria="app.pipeline.actionTypeLabel"></select><div id="op-fields"></div><p id="op-error" role="alert"></p><div class="dialog-actions"><button type="button" id="dismiss-op" data-i18n="common.cancel"></button><button type="submit" class="primary" data-i18n="common.ok"></button></div></form></dialog>
</body>
</html>
